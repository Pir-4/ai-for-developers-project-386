[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "call-booking"
version = "0.1.0"
description = "Запись на звонок — сервис бронирования времени (учебный проект Хекслета)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
