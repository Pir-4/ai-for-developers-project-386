<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Запись на звонок</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Запись на звонок</h1>

      <nav class="tabs">
        <button type="button" data-tab="guest" class="active">Записаться</button>
        <button type="button" data-tab="owner">Владельцу</button>
      </nav>

      <p id="status" role="status"></p>

      <!-- Сценарий гостя: выбрать дату, увидеть слоты, записаться -->
      <section id="tab-guest">
        <label>
          Дата:
          <input type="date" id="slot-date" />
        </label>
        <ul id="slot-list"></ul>
      </section>

      <!-- Сценарий владельца: опубликовать слот, посмотреть встречи -->
      <section id="tab-owner" hidden>
        <form id="publish-form">
          <label>
            Начало слота:
            <!-- step=1800 — шаг 30 минут, как в контракте -->
            <input type="datetime-local" id="publish-start" step="1800" required />
          </label>
          <button type="submit">Опубликовать слот</button>
        </form>

        <h2>Предстоящие встречи</h2>
        <button type="button" id="refresh-bookings">Обновить</button>
        <ul id="booking-list"></ul>
      </section>

      <!-- Диалог записи на выбранный слот -->
      <dialog id="booking-dialog">
        <form id="booking-form">
          <h2>Запись на <span id="booking-slot-time"></span></h2>
          <label>
            Имя:
            <input id="booking-name" required />
          </label>
          <label>
            Комментарий:
            <input id="booking-comment" />
          </label>
          <div class="dialog-actions">
            <button type="submit">Подтвердить</button>
            <button type="button" id="booking-cancel">Отмена</button>
          </div>
        </form>
      </dialog>
    </main>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
